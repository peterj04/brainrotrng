<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Brainrots RNG</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>🧠 Brainrots RNG</h1>
      <div class="stats">
        <div>Gems: <span id="gems">0</span></div>
        <div>Brainrots: <span id="brainrots">0</span></div>
      </div>
    </header>

    <main>
      <!-- Lucky Block Area -->
      <div class="mining-area">
        <h2>🔨 Lucky Blocks</h2>
        <div id="block-container" class="block-container">
          <!-- Blocks will be added by JS -->
        </div>
        <button id="spawn-block" class="btn">Spawn New Block</button>
      </div>

      <!-- Upgrade Shop -->
      <div class="shop">
        <h2>🛠️ Pickaxe Upgrades</h2>
        <div id="upgrades"></div>
      </div>

      <!-- Collection -->
      <div class="collection">
        <h2>📖 Brainrot Index</h2>
        <div id="collection-grid" class="collection-grid"></div>
      </div>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
