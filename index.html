<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Brainrots RNG - 3D</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
</head>
<body>
  <div id="ui-overlay">
    <div class="top-bar">
      <h1>🧠 Brainrots RNG</h1>
      <div class="stats">
        <span>Gems: <strong id="gems">0</strong></span>
        <span>Brainrots: <strong id="brainrots">0</strong></span>
      </div>
    </div>

    <div class="instructions">
      <strong>WASD</strong> - Move | <strong>Mouse</strong> - Look | <strong>Click</strong> - Mine | <strong>F</strong> - Fullscreen
    </div>

    <div id="crosshair">+</div>
  </div>

  <div id="game-over" class="hidden">Game Over</div>

  <script src="script.js"></script>
</body>
</html>
